[tool.poetry]
name = "llm-drug-bias"
version = "0.1.0"
description = "LLM drug selection bias evaluation experiment"
authors = ["LLM Bias Research Team <research@example.com>"]

[tool.poetry.dependencies]
python = "^3.10"
pandas = "^2.2.3"
openpyxl = "^3.1.5"
xlsxwriter = "^3.2.3"
anthropic = "^0.52.2"
python-dotenv = "^1.1.0"
openai = "^1.84.0"
google-generativeai = "^0.8.0"
ipykernel = "^6.29.5"
google-cloud-storage = "^3.1.1"
pyyaml = "^6.0"
tqdm = "^4.66.0"
matplotlib = "^3.8.0"
seaborn = "^0.13.0"
scipy = "^1.11.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
black = "^23.0.0"
flake8 = "^6.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"